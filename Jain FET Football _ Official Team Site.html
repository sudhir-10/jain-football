*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;
  background-color:#111111;
  background-image:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    var(--ground),
    radial-gradient(circle at 50% 50%, transparent 118px, rgba(255,255,255,.45) 119px, rgba(255,255,255,.45) 122px, transparent 123px),
    linear-gradient(to right, transparent calc(50% - 2px), rgba(255,255,255,.45) calc(50% - 2px), rgba(255,255,255,.45) calc(50% + 2px), transparent calc(50% + 2px)),
    linear-gradient(to right, transparent 4%, rgba(255,255,255,.45) 4% 4.3%, transparent 4.3% 95.7%, rgba(255,255,255,.45) 95.7% 96%, transparent 96%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 80px, rgba(255,255,255,.03) 80px 160px);
  background-attachment:fixed;background-size:cover,cover,auto,auto,auto,auto}
header{background:var(--green);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;flex-wrap:wrap;gap:10px}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:1px}
.brand span{color:var(--gold)}
nav a{color:#fff;text-decoration:none;margin-left:16px;font-weight:600;padding:6px 2px;border-bottom:3px solid transparent}
nav a.active,nav a:hover{border-bottom-color:var(--gold)}
.hero{background:var(--ground) center / contain no-repeat, var(--green);color:#fff;text-align:center;padding:56px 16px;border-bottom:6px solid var(--gold);min-height:260px;display:flex;flex-direction:column;justify-content:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.hero h1{margin:0 0 8px;font-size:2.4rem}
.hero p{margin:0;opacity:.85}
main{max-width:1100px;margin:24px auto;padding:28px 20px 60px;background:rgba(247,245,239,.95);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
h2{color:var(--green);border-left:6px solid var(--gold);padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
.card .body{padding:16px}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#ddd}
.date{color:var(--green2);font-weight:700;font-size:.9rem;text-transform:uppercase}
.tag{display:inline-block;background:var(--gold);color:var(--ink);font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px}
.jersey{font-size:2rem;font-weight:900;color:var(--gold);background:var(--green);border-radius:10px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.card.person .body{text-align:center}
button{background:var(--green);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.95rem}
button:hover{background:var(--green2)}
button.gold{background:var(--gold);color:var(--ink)}
button.danger{background:var(--red)}
button.small{padding:5px 10px;font-size:.8rem}
input,textarea,select{width:100%;padding:10px;border:1px solid #cfcfcf;border-radius:8px;font:inherit;margin-bottom:10px}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
.panel{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:24px}
.narrow{max-width:420px;margin:0 auto}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:#777;font-size:.9rem}
.err{color:var(--red);font-weight:600}
.hidden{display:none!important}
.filters{margin-bottom:18px}
.filters button{background:#e4e4e4;color:var(--ink);margin-right:6px}
.filters button.on{background:var(--green);color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
footer{text-align:center;padding:20px;color:#777;font-size:.85rem;border-top:1px solid #e3e3e3}
.empty{color:#888;font-style:italic}
@media(max-width:600px){.hero h1{font-size:1.7rem}nav a{margin-left:10px}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">JAIN FET <span>FOOTBALL</span></div>
    <nav>
      <a href="#events" data-page="events">Events</a>
      <a href="#gallery" data-page="gallery">Photos &amp; Trophies</a>
      <a href="#team" data-page="team">Team</a>
      <a href="#admin" data-page="admin">Admin</a>
    </nav>
  </div>
</header>

<div class="hero">
  <h1>Go Jain FET!</h1>
  <p>Our games. Our glory. Our team.</p>
</div>

<main>
  <section id="page-events"></section>
  <section id="page-gallery" class="hidden"></section>
  <section id="page-team" class="hidden"></section>
  <section id="page-admin" class="hidden"></section>
</main>

<footer>&copy; <span id="yr"></span> Jain FET Football Team</footer>

<script>
/* ===== SHARED DATA =====
   Everything is stored in this artifact's shared database (document "site/content").
   Photos are stored as uploaded assets; the database keeps their ids. */
const SITE_DOC = "site/content";
const EMPTY = { events: [], team: [], photos: [] };
let db = null, assets = null, canEdit = false;
let content = EMPTY;
let galleryFilter = "all";

const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const val = id => document.getElementById(id).value.trim();
const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const errText = e => (e && (e.message || e.code)) || "unknown error";

// Resize an image and return it as a JPEG blob
function toJpegBlob(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s);
        c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => (b ? resolve(b) : reject(new Error("could not encode image"))), "image/jpeg", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===== ROUTING ===== */
const pages = ["events", "gallery", "team", "admin"];
function currentPage() { const p = location.hash.slice(1); return pages.includes(p) ? p : "events"; }
function route() {
  const p = currentPage();
  pages.forEach(x => document.getElementById("page-" + x).classList.toggle("hidden", x !== p));
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.page === p));
  render(p);
}
function render(p) {
  ({ events: renderEvents, gallery: renderGallery, team: renderTeam, admin: renderAdmin })[p]();
}

/* ===== PUBLIC PAGES ===== */
const eventCard = e => `
  <div class="card">
    ${e.poster ? `<img src="/_blob/${esc(e.poster)}" alt="${esc(e.title)} poster" style="height:auto;max-height:420px;object-fit:contain;background:#000">` : ""}
    <div class="body">
    <div class="date">${fmtDate(e.date)}</div>
    <h3 style="margin:6px 0">${esc(e.title)}</h3>
    <div class="muted">📍 ${esc(e.location)}</div>
    <p>${esc(e.desc)}</p>
  </div></div>`;

function renderEvents() {
  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...content.events].sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = sorted.filter(e => e.date >= today);
  const past = sorted.filter(e => e.date < today).reverse();
  document.getElementById("page-events").innerHTML = `
    <h2>Upcoming Events</h2>
    <div class="grid">${upcoming.map(eventCard).join("") || '<p class="empty">No upcoming events yet. Check back soon!</p>'}</div>
    ${past.length ? `<h2 style="margin-top:36px">Past Events</h2><div class="grid">${past.map(eventCard).join("")}</div>` : ""}`;
}

function setFilter(f) { galleryFilter = f; renderGallery(); }
function renderGallery() {
  const items = content.photos.filter(p => galleryFilter === "all" || p.kind === galleryFilter);
  document.getElementById("page-gallery").innerHTML = `
    <h2>Photos &amp; Trophies</h2>
    <div class="filters">
      ${[["all", "All"], ["team", "Team Photos"], ["trophy", "Trophies"]]
        .map(([k, l]) => `<button class="${galleryFilter === k ? "on" : ""}" onclick="setFilter('${k}')">${l}</button>`).join("")}
    </div>
    <div class="grid">${items.map(p => `
      <div class="card"><img src="/_blob/${esc(p.asset)}" alt="${esc(p.caption)}">
        <div class="body">
          <span class="tag">${p.kind === "trophy" ? "🏆 Trophy" : "📸 Team"}</span>
          <p style="margin:8px 0 0">${esc(p.caption)}</p>
        </div>
      </div>`).join("") || '<p class="empty">No photos yet.</p>'}
    </div>`;
}

function renderTeam() {
  document.getElementById("page-team").innerHTML = `
    <h2>Team Roster</h2>
    <div class="grid">${content.team.map(m => `
      <div class="card person"><div class="body">
        <div class="jersey">${esc(m.number)}</div>
        <h3 style="margin:0">${esc(m.name)}</h3>
        <div class="muted">${esc(m.position)} · ${esc(m.year)}</div>
      </div></div>`).join("") || '<p class="empty">Roster coming soon.</p>'}
    </div>`;
}

/* ===== ADMIN ===== */
function renderAdmin() {
  const el = document.getElementById("page-admin");
  if (!canEdit) {
    el.innerHTML = `
      <div class="panel narrow">
        <h2>Admin</h2>
        <p>Only editors of this site can manage events, photos, and the roster. If you should have access, ask the site owner to add you as an editor.</p>
      </div>`;
    return;
  }
  el.innerHTML = `
    <h2>Admin Dashboard</h2>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">

      <div class="panel">
        <h3>Post an Event</h3>
        <label>Title</label><input id="ev-title">
        <label>Date</label><input type="date" id="ev-date">
        <label>Location</label><input id="ev-loc">
        <label>Description</label><textarea id="ev-desc" rows="3"></textarea>
        <label>Event poster (optional)</label><input type="file" id="ev-poster" accept="image/*">
        <p id="ev-status" class="muted"></p>
        <button onclick="addEvent()">Post Event</button>
        <div style="margin-top:14px">${content.events.map(e => `
          <div class="item"><span>${esc(e.title)} <span class="muted">${esc(e.date)}</span></span>
          <button class="danger small" onclick="delEvent('${e.id}')">Delete</button></div>`).join("")}
        </div>
      </div>

      <div class="panel">
        <h3>Upload Photo / Trophy</h3>
        <label>Image file</label><input type="file" id="ph-file" accept="image/*">
        <label>Type</label>
        <select id="ph-kind"><option value="team">Team photo</option><option value="trophy">Trophy</option></select>
        <label>Caption</label><input id="ph-cap">
        <button onclick="addPhoto()">Upload</button>
        <p id="ph-status" class="muted"></p>
        <div style="margin-top:14px;max-height:260px;overflow:auto">${content.photos.map(p => `
          <div class="item"><span>${esc(p.caption) || "(no caption)"} <span class="muted">${esc(p.kind)}</span></span>
          <button class="danger small" onclick="delPhoto('${p.id}')">Delete</button></div>`).join("")}
        </div>
      </div>

      <div class="panel">
        <h3>Team Roster</h3>
        <label>Name</label><input id="tm-name">
        <label>Jersey number</label><input id="tm-num">
        <label>Position</label><input id="tm-pos">
        <label>Year</label><input id="tm-year" placeholder="e.g. Junior">
        <button onclick="addMember()">Add Player</button>
        <div style="margin-top:14px">${content.team.map(m => `
          <div class="item"><span>#${esc(m.number)} ${esc(m.name)}</span>
          <button class="danger small" onclick="delMember('${m.id}')">Remove</button></div>`).join("")}
        </div>
      </div>

    </div>`;
}

// Writes the whole content document to the shared database
async function save(next) {
  content = next;
  route();
  if (!db) return alert("Could not reach the shared database. This change was not saved.");
  try { await db.doc(SITE_DOC).set(content); }
  catch (e) { alert("Could not save: " + errText(e)); }
}

async function addEvent() {
  const title = val("ev-title"), date = val("ev-date");
  if (!title || !date) return alert("Title and date are required.");
  const file = document.getElementById("ev-poster").files[0];
  const status = document.getElementById("ev-status");
  let poster = null;
  if (file) {
    if (!assets) return alert("Poster upload is not available in this view.");
    status.textContent = "Uploading poster…";
    try {
      const blob = await toJpegBlob(file, 1600);
      poster = (await assets.upload(blob)).id;
    } catch (e) {
      status.textContent = "Poster upload failed: " + errText(e);
      return;
    }
  }
  save({ ...content, events: [...content.events, { id: uid(), title, date, location: val("ev-loc"), desc: val("ev-desc"), poster }] });
}
async function delEvent(id) {
  if (!confirm("Delete this event?")) return;
  const ev = content.events.find(e => e.id === id);
  await save({ ...content, events: content.events.filter(e => e.id !== id) });
  if (assets && ev && ev.poster) assets.delete(ev.poster).catch(() => {});
}

async function addPhoto() {
  const file = document.getElementById("ph-file").files[0];
  const status = document.getElementById("ph-status");
  if (!file) return alert("Choose an image first.");
  if (!assets) return alert("Photo upload is not available in this view.");
  status.textContent = "Uploading…";
  try {
    const blob = await toJpegBlob(file, 1600);
    const asset = await assets.upload(blob);
    await save({ ...content, photos: [...content.photos, { id: uid(), asset: asset.id, kind: val("ph-kind"), caption: val("ph-cap") }] });
  } catch (e) {
    status.textContent = "Upload failed: " + errText(e);
  }
}
async function delPhoto(id) {
  if (!confirm("Delete this photo?")) return;
  const photo = content.photos.find(p => p.id === id);
  await save({ ...content, photos: content.photos.filter(p => p.id !== id) });
  if (assets && photo) assets.delete(photo.asset).catch(() => {});
}

function addMember() {
  const name = val("tm-name");
  if (!name) return alert("Name is required.");
  save({ ...content, team: [...content.team, { id: uid(), name, number: val("tm-num"), position: val("tm-pos"), year: val("tm-year") }] });
}
function delMember(id) {
  if (!confirm("Remove this player?")) return;
  save({ ...content, team: content.team.filter(m => m.id !== id) });
}

/* ===== CONNECT & START ===== */
function connect() {
  if (!db) return;
  db.doc(SITE_DOC).onSnapshot(snap => {
    content = snap.exists ? { ...EMPTY, ...snap.data() } : EMPTY;
    route();
  }, e => console.warn("Shared data error:", e));
}

async function init() {
  document.getElementById("yr").textContent = new Date().getFullYear();
  try {
    db = await window.claude.use("db");
    assets = await window.claude.use("assets");
    const user = await window.claude.use("user");
    canEdit = (await user?.canEdit()) === true;
  } catch (e) { /* not available in this view: read-only fallback */ }
  connect();
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
  if (!location.hash) history.replaceState(null, "", "#events");
  route();
}
init();
</script>
</body>
</html>
